name: 自动更新数据与报告

on:
  schedule:
    - cron: '30 22 * * 6'   # 周六 UTC 22:30 = 北京时间每周日 06:30
  workflow_dispatch:         # 手动触发（Actions 页面点 Run workflow）
    inputs:
      force_report:
        description: '强制补发报告: weekly / monthly / quarterly / yearly（留空=不补发）'
        required: false
        default: ''

permissions:
  contents: write
  issues: write            # 失败时开 Issue 通知（GitHub 会邮件提醒仓库所有者）

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖（繁简归一去重）
        run: pip install zhconv==1.4.3

      - name: 抓取 + 自动核实入库
        run: python scripts/update.py

      - name: 生成到期报告
        env:
          FORCE_REPORT: ${{ github.event.inputs.force_report }}
        run: python scripts/report.py

      - name: 提交变更
        run: |
          git config user.name "muskintel-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto: 数据更新与报告 $(date -u +%F)"
          git push

      - name: 失败通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "自动更新失败 $(date -u +%F)" --body "每周自动更新运行失败，网站数据本次未刷新。运行日志：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
